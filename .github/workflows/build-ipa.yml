name: Build UltimateToolbox IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project UltimateToolbox.xcodeproj \
            -scheme UltimateToolbox \
            -archivePath build/UltimateToolbox.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/UltimateToolbox.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r UltimateToolbox-unsigned.ipa Payload
          ls -lh UltimateToolbox-unsigned.ipa

      - name: Verify IPA
        run: |
          unzip -p build/UltimateToolbox-unsigned.ipa 'Payload/*.app/Info.plist' > /tmp/UT-info.plist
          python3 - <<'EOF'
          import plistlib, sys
          d = plistlib.load(open('/tmp/UT-info.plist', 'rb'))
          assert d.get('CFBundleExecutable'), 'missing CFBundleExecutable'
          assert d.get('CFBundleIdentifier') == 'com.hmk849.ultimatetoolbox', d.get('CFBundleIdentifier')
          assert d.get('CFBundleShortVersionString') == '1.0.3', d.get('CFBundleShortVersionString')
          assert d.get('CFBundleVersion') == '4', d.get('CFBundleVersion')
          assert d.get('MinimumOSVersion') == '26.0', d.get('MinimumOSVersion')
          print('IPA verify OK:', d['CFBundleIdentifier'], d['CFBundleShortVersionString'], d['CFBundleVersion'])
          EOF
          unzip -l build/UltimateToolbox-unsigned.ipa | grep -q 'respring.html' || (echo 'respring.html missing from bundle' && exit 1)
          unzip -l build/UltimateToolbox-unsigned.ipa | grep -q 'Assets.car' || (echo 'Assets.car missing' && exit 1)
          echo 'bundle resources OK'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateToolbox-unsigned
          path: build/UltimateToolbox-unsigned.ipa
          if-no-files-found: error
