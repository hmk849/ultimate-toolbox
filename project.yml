name: UltimateToolbox
options:
  bundleIdPrefix: com.hmk849
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  UltimateToolbox:
    type: application
    platform: iOS
    sources:
      - path: Sources/UltimateToolbox
    info:
      path: Sources/UltimateToolbox/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "4"
        CFBundleDisplayName: Ultimate Toolbox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSBluetoothAlwaysUsageDescription: "显示蓝牙开关状态（仅读取系统蓝牙状态，不扫描、不连接任何设备）。"
        NSBluetoothPeripheralUsageDescription: "显示蓝牙开关状态（仅读取系统蓝牙状态，不扫描、不连接任何设备）。"
        NSLocationWhenInUseUsageDescription: "读取当前 Wi-Fi 名称需要精确位置权限，仅用于识别当前网络，不记录、不上传位置。"
        CFBundleURLTypes:
          - CFBundleURLName: com.hmk849.ultimatetoolbox.github
            CFBundleURLSchemes:
              - com.hmk849.ultimatetoolbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmk849.ultimatetoolbox
        PRODUCT_NAME: "Ultimate Toolbox"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/UltimateToolbox/Engine/UltimateToolbox-Bridging-Header.h
    dependencies:
      - sdk: WebKit.framework
      - sdk: libz.tbd
      - sdk: IOKit.framework
      - sdk: NetworkExtension.framework
      - sdk: CoreLocation.framework
    entitlements:
      path: Sources/UltimateToolbox/UltimateToolbox.entitlements
    capabilities:
      - type: keychain-sharing
      - type: app-groups
        additionalProperties:
          groups:
            - "group.com.hmk849.ultimatetoolbox"
